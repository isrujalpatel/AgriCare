<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cart — AgriCare</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="page-bg">
  <header class="site-header">
    <div class="brand"><h1>AgriCare</h1><div class="tagline">Your Shield Against Unwanted Guests</div></div>
    <div class="nav-wrap">
      <nav class="top-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="cart.html" class="nav-link">Cart</a>
        <a href="orders.html" class="nav-link">My Orders</a>
        <a href="contact.html" class="nav-link">Contact</a>
        <a href="auth/login.html" class="nav-link">Login</a>
      </nav>
    </div>
  </header>

  <main style="max-width:1000px;margin:26px auto;padding:12px;">
    <h2>Your Cart</h2>
    <div id="cartPageItems"></div>

    <div style="margin-top:18px;padding:14px;background:rgba(255,255,255,0.92);border-radius:10px">
      <h3>Shipping & Checkout</h3>
      <label>Delivery area
        <select id="deliveryArea">
          <option value="zone1" data-fee="40">Zone 1 — Nearby (₹40)</option>
          <option value="zone2" data-fee="55">Zone 2 — City (₹55)</option>
          <option value="zone3" data-fee="70">Zone 3 — Outskirts (₹70)</option>
        </select>
      </label>
      <div style="margin-top:10px">
        <strong>Subtotal:</strong> ₹<span id="cartPageSubtotal">0</span><br/>
        <strong>Delivery:</strong> ₹<span id="cartPageDelivery">0</span><br/>
        <strong>Total:</strong> ₹<span id="cartPageTotal">0</span>
      </div>

      <form id="checkoutForm" style="margin-top:12px;">
        <div style="display:grid;gap:8px;max-width:520px">
          <label>Full name
            <input id="checkoutName" type="text" placeholder="John Doe" required />
          </label>
          <label>Phone number
            <input id="checkoutPhone" type="tel" placeholder="10 digit phone" pattern="[0-9]{6,15}" required />
          </label>
          <label>Delivery address
            <textarea id="checkoutAddr" rows="3" placeholder="Street, Village, City, Pincode" required></textarea>
          </label>
        </div>
        <div style="margin-top:12px">
          <button type="submit" id="proceedCheckoutBtn" class="btn">Place Order</button>
          <span id="checkoutMessage" style="margin-left:12px;color:var(--accent-color);font-weight:600"></span>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">© 2025 AgriCare</footer>

  <script src="assets/js/cart.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
