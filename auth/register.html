<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — AgriCare</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body style="background:url('../assets/images/img.jpg') center/cover fixed;">
  <div style="max-width:420px;margin:80px auto;background:rgba(255,255,255,0.9);padding:20px;border-radius:12px">
    <h2>Register</h2>
    <form id="registerForm">
      <label>Full name<input id="regName" required style="width:100%;padding:8px;margin-top:6px"></label>
      <label style="margin-top:8px">Email<input id="regEmail" type="email" required style="width:100%;padding:8px;margin-top:6px"></label>
      <label style="margin-top:8px">Password<input id="regPass" type="password" required style="width:100%;padding:8px;margin-top:6px"></label>
      <div style="margin-top:12px"><button class="btn" type="submit">Create account</button></div>
    </form>
    <p style="margin-top:12px">For demo only — stored in your browser.</p>
  </div>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
