<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — AgriCare</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body style="background:url('../assets/images/img.jpg') center/cover fixed;">
  <div style="max-width:420px;margin:80px auto;background:rgba(255,255,255,0.9);padding:20px;border-radius:12px">
    <h2>Login</h2>
    <form id="loginForm">
      <label>Email<input id="loginEmail" type="email" required style="width:100%;padding:8px;margin-top:6px"></label>
      <label style="margin-top:8px">Password<input id="loginPass" type="password" required style="width:100%;padding:8px;margin-top:6px"></label>
      <div style="margin-top:12px"><button class="btn" type="submit">Login</button> <a href="register.html" style="margin-left:10px">Register</a></div>
    </form>
    <p style="margin-top:12px">Demo accounts are stored in browser only.</p>
  </div>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
